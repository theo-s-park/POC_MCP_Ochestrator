<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">MCP 오케스트레이터 — 전체 시스템 아키텍처</text>

  <!-- ===== MCP Orchestrator outer box ===== -->
  <rect x="30" y="60" width="840" height="240" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">MCP Orchestrator  (Spring Boot :8080)</text>

  <!-- McpServer Registry -->
  <rect x="60" y="95" width="200" height="185" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="60" y="95" width="200" height="30" rx="8" fill="#3b82f6"/>
  <rect x="60" y="113" width="200" height="12" fill="#3b82f6"/>
  <text x="160" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">McpServer Registry</text>
  <text x="160" y="148" text-anchor="middle" font-size="11" fill="#475569">서버 등록 &amp; 관리</text>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#475569">Tool/Resource 수집</text>
  <text x="160" y="182" text-anchor="middle" font-size="11" fill="#475569">헬스체크 (60초 주기)</text>
  <text x="160" y="199" text-anchor="middle" font-size="11" fill="#475569">재등록 처리</text>
  <text x="160" y="225" text-anchor="middle" font-size="10" fill="#94a3b8">H2 File DB</text>
  <text x="160" y="240" text-anchor="middle" font-size="10" fill="#94a3b8">(./data/*.mv.db)</text>
  <text x="160" y="265" text-anchor="middle" font-size="10" fill="#94a3b8">ACTIVE / INACTIVE / PENDING</text>

  <!-- Agent Service -->
  <rect x="310" y="95" width="200" height="185" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="310" y="95" width="200" height="30" rx="8" fill="#7c3aed"/>
  <rect x="310" y="113" width="200" height="12" fill="#7c3aed"/>
  <text x="410" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Agent Service</text>
  <text x="410" y="148" text-anchor="middle" font-size="11" fill="#475569">자연어 질문 수신</text>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#475569">LLM (GPT-4o-mini)</text>
  <text x="410" y="182" text-anchor="middle" font-size="11" fill="#475569">Tool 자동 선택</text>
  <text x="410" y="199" text-anchor="middle" font-size="11" fill="#475569">tools/call 실행</text>
  <text x="410" y="216" text-anchor="middle" font-size="11" fill="#475569">결과 자연어 정리</text>
  <text x="410" y="255" text-anchor="middle" font-size="10" fill="#94a3b8">결과 6000자 초과 → truncate</text>

  <!-- Web UI -->
  <rect x="560" y="95" width="285" height="185" rx="8" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="560" y="95" width="285" height="30" rx="8" fill="#059669"/>
  <rect x="560" y="113" width="285" height="12" fill="#059669"/>
  <text x="702" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Web UI  (Thymeleaf)</text>
  <text x="702" y="145" text-anchor="middle" font-size="11" fill="#475569">/servers  — 서버 목록 &amp; 등록</text>
  <text x="702" y="162" text-anchor="middle" font-size="11" fill="#475569">/tools  — 수집된 Tool 목록</text>
  <text x="702" y="179" text-anchor="middle" font-size="11" fill="#475569">/agent  — Agent 채팅 UI</text>
  <text x="702" y="196" text-anchor="middle" font-size="11" fill="#475569">/backoffice  — 앱 메타 관리</text>
  <text x="702" y="213" text-anchor="middle" font-size="11" fill="#475569">/web  — 공개 앱 마켓플레이스</text>
  <text x="702" y="250" text-anchor="middle" font-size="10" fill="#94a3b8">isVisible=true 앱 → 카드 노출</text>
  <text x="702" y="267" text-anchor="middle" font-size="10" fill="#94a3b8">사용 버튼 → Agent 실행</text>

  <!-- ===== MCP Servers outer box ===== -->
  <rect x="30" y="355" width="520" height="175" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">MCP 서버들</text>

  <!-- weather server -->
  <rect x="55" y="388" width="210" height="125" rx="8" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="55" y="388" width="210" height="28" rx="8" fill="#d97706"/>
  <rect x="55" y="404" width="210" height="12" fill="#d97706"/>
  <text x="160" y="407" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">weather-server  :8081</text>
  <text x="160" y="435" text-anchor="middle" font-size="10" fill="#475569">GET  /health</text>
  <text x="160" y="452" text-anchor="middle" font-size="10" fill="#475569">POST /mcp</text>
  <text x="160" y="469" text-anchor="middle" font-size="10" fill="#475569">tools/list · tools/call</text>
  <text x="160" y="490" text-anchor="middle" font-size="10" fill="#94a3b8">Open-Meteo API 기반</text>

  <!-- deepwiki adapter -->
  <rect x="295" y="388" width="235" height="125" rx="8" fill="#fff" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="295" y="388" width="235" height="28" rx="8" fill="#d97706"/>
  <rect x="295" y="404" width="235" height="12" fill="#d97706"/>
  <text x="412" y="407" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">deepwiki-adapter  :8082</text>
  <text x="412" y="435" text-anchor="middle" font-size="10" fill="#475569">GET  /health  (자체 200)</text>
  <text x="412" y="452" text-anchor="middle" font-size="10" fill="#475569">POST /mcp  → SSE→JSON 변환</text>
  <text x="412" y="469" text-anchor="middle" font-size="10" fill="#475569">→ mcp.deepwiki.com/mcp</text>
  <text x="412" y="490" text-anchor="middle" font-size="10" fill="#94a3b8">어댑터 패턴 (Streamable HTTP 브리지)</text>

  <!-- ===== External User / Client box ===== -->
  <rect x="600" y="355" width="270" height="175" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="735" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">클라이언트 / 외부</text>

  <rect x="620" y="388" width="230" height="55" rx="8" fill="#fff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="735" y="410" text-anchor="middle" font-size="11" fill="#475569">Backoffice 관리자</text>
  <text x="735" y="430" text-anchor="middle" font-size="10" fill="#94a3b8">PATCH /api/mcp/apps/{id}</text>

  <rect x="620" y="455" width="230" height="55" rx="8" fill="#fff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="735" y="477" text-anchor="middle" font-size="11" fill="#475569">CI/CD 파이프라인</text>
  <text x="735" y="497" text-anchor="middle" font-size="10" fill="#94a3b8">POST /api/mcp/servers/register</text>

  <!-- ===== Arrows ===== -->
  <!-- Orchestrator ↔ MCP Servers -->
  <line x1="160" y1="280" x2="160" y2="388" stroke="#4a9eff" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="290" y1="310" x2="412" y2="388" stroke="#4a9eff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Registry ↔ Agent (internal) -->
  <line x1="260" y1="188" x2="310" y2="188" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- Orchestrator ↔ External -->
  <line x1="735" y1="300" x2="735" y2="355" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="70" y="320" width="135" height="20" rx="4" fill="#dbeafe"/>
  <text x="137" y="334" text-anchor="middle" font-size="10" fill="#1d4ed8">MCP Protocol (JSON-RPC/HTTP)</text>

  <!-- Legend -->
  <rect x="30" y="545" width="840" height="12" rx="4" fill="none"/>
  <text x="450" y="555" text-anchor="middle" font-size="10" fill="#94a3b8">* 모든 MCP 통신: POST {serverUrl}/mcp  |  헬스체크: GET {serverUrl}/health  |  DB: H2 파일 DB</text>
</svg>
