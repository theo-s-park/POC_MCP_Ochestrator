<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#059669"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="860" height="420" fill="#f8fafc" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">외부 상용 MCP 서버 연결 — 어댑터 패턴</text>

  <!-- ===== Orchestrator ===== -->
  <rect x="30" y="70" width="200" height="230" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <rect x="30" y="70" width="200" height="38" rx="10" fill="#2563eb"/>
  <rect x="30" y="96" width="200" height="12" fill="#2563eb"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MCP Orchestrator</text>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#1e293b">동기 HTTP POST 방식</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#1e293b">GET /health 폴링</text>
  <text x="130" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">서버에게 기대하는 것:</text>
  <text x="130" y="202" text-anchor="middle" font-size="10" fill="#475569">• GET /health → 200</text>
  <text x="130" y="218" text-anchor="middle" font-size="10" fill="#475569">• POST /mcp → JSON 응답</text>
  <text x="130" y="235" text-anchor="middle" font-size="10" fill="#475569">• SSE 없음</text>
  <text x="130" y="255" text-anchor="middle" font-size="10" fill="#94a3b8">↑ 이 형식이 맞아야 등록 가능</text>

  <!-- ===== Adapter ===== -->
  <rect x="300" y="70" width="240" height="300" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#sh)"/>
  <rect x="300" y="70" width="240" height="38" rx="10" fill="#d97706"/>
  <rect x="300" y="96" width="240" height="12" fill="#d97706"/>
  <text x="420" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">어댑터  (localhost:8082)</text>

  <text x="420" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">처리하는 항목</text>

  <!-- Table in adapter -->
  <rect x="315" y="140" width="210" height="26" rx="4" fill="#fff7ed" stroke="#fde68a" stroke-width="1"/>
  <text x="420" y="158" text-anchor="middle" font-size="10" fill="#92400e">GET /health → 항상 200 반환 (자체)</text>

  <rect x="315" y="172" width="210" height="26" rx="4" fill="#fff7ed" stroke="#fde68a" stroke-width="1"/>
  <text x="420" y="190" text-anchor="middle" font-size="10" fill="#92400e">Accept: application/json, text/event-stream</text>

  <rect x="315" y="204" width="210" height="26" rx="4" fill="#fff7ed" stroke="#fde68a" stroke-width="1"/>
  <text x="420" y="222" text-anchor="middle" font-size="10" fill="#92400e">SSE 스트림 → JSON 파싱·변환</text>

  <rect x="315" y="236" width="210" height="26" rx="4" fill="#fff7ed" stroke="#fde68a" stroke-width="1"/>
  <text x="420" y="254" text-anchor="middle" font-size="10" fill="#92400e">data: {...} 라인 추출 후 반환</text>

  <text x="420" y="292" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">DeepWiki 예시</text>
  <text x="420" y="310" text-anchor="middle" font-size="10" fill="#92400e">localhost:8082</text>
  <text x="420" y="327" text-anchor="middle" font-size="10" fill="#475569">→ mcp.deepwiki.com/mcp</text>
  <text x="420" y="350" text-anchor="middle" font-size="9" fill="#94a3b8">Flask (Python) 기반</text>

  <!-- ===== Commercial MCP Server ===== -->
  <rect x="620" y="70" width="210" height="230" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#sh)"/>
  <rect x="620" y="70" width="210" height="38" rx="10" fill="#7c3aed"/>
  <rect x="620" y="96" width="210" height="12" fill="#7c3aed"/>
  <text x="725" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">상용 MCP 서버</text>
  <text x="725" y="132" text-anchor="middle" font-size="11" fill="#1e293b">표준 Streamable HTTP</text>
  <text x="725" y="152" text-anchor="middle" font-size="11" fill="#1e293b">mcp.deepwiki.com</text>
  <text x="725" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">실제 응답 형식:</text>
  <text x="725" y="202" text-anchor="middle" font-size="10" fill="#475569">• GET /health → 없음</text>
  <text x="725" y="218" text-anchor="middle" font-size="10" fill="#475569">• SSE 스트림 포함</text>
  <text x="725" y="235" text-anchor="middle" font-size="10" fill="#475569">• Accept 헤더 필수</text>
  <text x="725" y="255" text-anchor="middle" font-size="10" fill="#94a3b8">↑ MCP 관리 서버 직접 등록 불가</text>

  <!-- Arrows between boxes -->
  <!-- Orchestrator → Adapter -->
  <line x1="230" y1="160" x2="298" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="228" y="142" width="72" height="28" rx="4" fill="#dbeafe"/>
  <text x="264" y="155" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d4ed8">POST /mcp</text>
  <text x="264" y="167" text-anchor="middle" font-size="9" fill="#3b82f6">JSON-RPC</text>

  <!-- Adapter → Orchestrator (response) -->
  <line x1="298" y1="215" x2="230" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="228" y="197" width="72" height="28" rx="4" fill="#dcfce7"/>
  <text x="264" y="210" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">JSON 응답</text>
  <text x="264" y="222" text-anchor="middle" font-size="9" fill="#16a34a">변환 완료</text>

  <!-- Adapter → Commercial -->
  <line x1="540" y1="160" x2="618" y2="160" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="538" y="141" width="82" height="28" rx="4" fill="#faf5ff"/>
  <text x="579" y="154" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7c3aed">POST /mcp</text>
  <text x="579" y="166" text-anchor="middle" font-size="9" fill="#9333ea">SSE 허용</text>

  <!-- Commercial → Adapter (response) -->
  <line x1="618" y1="215" x2="540" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="538" y="196" width="82" height="28" rx="4" fill="#faf5ff"/>
  <text x="579" y="209" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7c3aed">SSE 스트림</text>
  <text x="579" y="221" text-anchor="middle" font-size="9" fill="#9333ea">data: {...}</text>

  <!-- Bottom flow label -->
  <rect x="30" y="390" width="800" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="405" text-anchor="middle" font-size="10.5" fill="#475569">MCP 관리 서버 입장에서 어댑터 = 일반 MCP 서버  |  어댑터 = 프록시 레이어  |  상용 서버 변경 없음</text>
</svg>
