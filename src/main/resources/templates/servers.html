<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Servers — MCP Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f5f7fa;
  --surface:   #ffffff;
  --surface2:  #f3f4f6;
  --surface3:  #eaecef;
  --border:    rgba(0,0,0,0.08);
  --border-hi: rgba(0,0,0,0.16);
  --text:      #111827;
  --muted:     #6b7280;
  --subtle:    #c4c8d0;
  --accent:    #4f46e5;
  --accent-d:  rgba(79,70,229,0.08);
  --blue:      #2563eb;
  --blue-d:    rgba(37,99,235,0.10);
  --amber:     #d97706;
  --red:       #dc2626;
  --green:     #16a34a;
  --green-d:   rgba(22,163,74,0.10);
  --sidebar-w: 228px;
  --radius:    10px;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); min-height: 100vh; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; z-index: 100;
}
.sidebar-logo {
  padding: 28px 24px 24px; font-family: var(--font-head); font-size: 22px;
  font-weight: 800; letter-spacing: -0.5px; color: var(--text);
}
.sidebar-logo span { color: var(--accent); }
.sidebar-divider { height: 1px; background: var(--border); margin: 0 16px 12px; }
.nav-section { padding: 0 12px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: 7px; text-decoration: none; color: var(--muted);
  font-size: 13px; font-weight: 500; transition: all .15s; margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent-d); color: var(--accent); }
.nav-icon { width: 16px; height: 16px; opacity: .7; flex-shrink: 0; }

/* ── Main ── */
.main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; padding: 36px 40px; max-width: 1100px; }

/* Dot grid background */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ── Page header ── */
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; }
.page-title { font-family: var(--font-head); font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.page-subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
  border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
  border: none; transition: all .15s; text-decoration: none; font-family: var(--font-body);
}
.btn-primary { background: var(--accent); color: #ffffff; }
.btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79,70,229,.25); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--border-hi); color: var(--text); background: var(--surface2); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(220,38,38,.2); padding: 5px 12px; font-size: 12px; }
.btn-danger:hover { background: rgba(220,38,38,.06); }

/* ── Register panel ── */
.register-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; max-height: 0; transition: max-height .3s ease, padding .3s ease;
  margin-bottom: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.register-panel.open { max-height: 200px; margin-bottom: 24px; }
.register-inner { padding: 24px; }
.register-title { font-family: var(--font-head); font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr .6fr .5fr auto; gap: 10px; align-items: end; }
.form-group label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
.form-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 9px 12px; color: var(--text); font-size: 13px;
  outline: none; transition: border .15s; font-family: var(--font-body);
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-d); }
.form-input::placeholder { color: var(--subtle); }
.register-msg { margin-top: 10px; font-size: 12px; }
.msg-ok { color: var(--green); }
.msg-err { color: var(--red); }

/* ── Server grid ── */
.grid-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.grid-title { font-family: var(--font-head); font-size: 15px; font-weight: 600; }
.server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

/* ── Server card ── */
.server-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 14px;
  transition: border-color .2s, transform .2s, box-shadow .2s; position: relative; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.server-card:hover { border-color: var(--border-hi); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.09); }
.server-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--blue)); opacity: 0;
  transition: opacity .2s;
}
.server-card:hover::before { opacity: 1; }

.card-top { display: flex; align-items: center; justify-content: space-between; }
.card-name { font-family: var(--font-head); font-size: 16px; font-weight: 600; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--subtle);
}
.status-dot.active { background: var(--green); box-shadow: 0 0 0 3px var(--green-d); animation: pulse 2s infinite; }
.status-dot.pending { background: var(--amber); }
.status-dot.inactive { background: var(--red); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px var(--green-d); } 50% { box-shadow: 0 0 0 6px transparent; } }

.status-badge {
  font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
  letter-spacing: .06em; text-transform: uppercase;
}
.status-badge.active { background: var(--green-d); color: var(--green); }
.status-badge.pending { background: rgba(217,119,6,.10); color: var(--amber); }
.status-badge.inactive { background: rgba(220,38,38,.10); color: var(--red); }
.status-badge.registration_failed { background: rgba(220,38,38,.10); color: var(--red); }

.card-url { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.card-tools { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
.tool-badge {
  font-family: var(--font-mono); font-size: 11px; padding: 3px 9px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--blue);
}

.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.card-time { font-size: 11px; color: var(--muted); }

/* ── Empty state ── */
.empty-state {
  grid-column: 1/-1; padding: 60px 20px; text-align: center;
  color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius);
  background: var(--surface);
}
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: .35; }
.empty-title { font-family: var(--font-head); font-size: 16px; margin-bottom: 6px; color: var(--text); opacity: .45; }

/* ── Probe buttons ── */
.card-probe { display:flex; gap:6px; padding: 0 0 4px; }
.btn-probe { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; font-size:11px; font-family:var(--font-mono); border-radius:5px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); cursor:pointer; transition:all .15s; }
.btn-probe:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-d); }

/* ── Probe Modal ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); z-index:300; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:620px; max-width:95vw; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.18); }
.modal-head { padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-title { font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--accent); }
.modal-meta { font-size:11px; color:var(--muted); margin-left:10px; }
.modal-close { width:28px; height:28px; background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close:hover { background:var(--surface2); color:var(--text); }
.modal-body { padding:16px 20px; overflow-y:auto; flex:1; }
.modal-body pre { font-family:var(--font-mono); font-size:12px; line-height:1.7; color:var(--text); white-space:pre-wrap; word-break:break-all; }
.modal-loading { color:var(--muted); font-style:italic; font-size:13px; }
.modal-err { color:var(--red); font-size:13px; }

/* ── Toast Stack ── */
#toastStack { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column-reverse; gap:8px; z-index:9999; pointer-events:none; }
.t { display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px 10px; font-size:13px; min-width:240px; max-width:340px; box-shadow:0 8px 24px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06); transform:translateX(calc(100% + 40px)); opacity:0; transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s; pointer-events:all; overflow:hidden; position:relative; }
.t.in { transform:translateX(0); opacity:1; }
.t.ok { border-left:3px solid var(--green); }
.t.err { border-left:3px solid var(--red); }
.t.info { border-left:3px solid var(--blue); }
.t-ic { font-size:14px; line-height:1; flex-shrink:0; margin-top:2px; }
.t.ok .t-ic { color:var(--green); }
.t.err .t-ic { color:var(--red); }
.t.info .t-ic { color:var(--blue); }
.t-body { flex:1; min-width:0; }
.t-title { font-weight:600; color:var(--text); line-height:1.3; }
.t-sub { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.t-bar { position:absolute; bottom:0; left:0; height:2px; background:currentColor; opacity:.2; animation:tbar var(--tdur,3s) linear forwards; }
.t.ok .t-bar { color:var(--green); }
.t.err .t-bar { color:var(--red); }
.t.info .t-bar { color:var(--blue); }
@keyframes tbar { from{width:100%}to{width:0} }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">MCP<span>Hub</span></div>
  <div class="sidebar-divider"></div>
  <nav class="nav-section">
    <a href="/" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Servers
    </a>
    <a href="/tools" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
      Tools
    </a>
    <a href="/demo" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Agent Demo
    </a>
    <a href="/agent" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v2M12 11h.01"/></svg>
      Agent Chat
    </a>
    <a href="/web" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>Marketplace
    </a>
    <a href="/backoffice" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Backoffice
    </a>
  </nav>
</aside>

<!-- Main -->
<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Servers</h1>
      <p class="page-subtitle">Registered MCP servers and their status</p>
    </div>
    <button class="btn btn-primary" onclick="toggleForm()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Register Server
    </button>
  </div>

  <!-- Register panel -->
  <div class="register-panel" id="registerPanel">
    <div class="register-inner">
      <div class="register-title">New MCP Server</div>
      <div class="form-grid">
        <div class="form-group"><label>Name</label><input id="rName" class="form-input" placeholder="image-tool"></div>
        <div class="form-group"><label>URL</label><input id="rUrl" class="form-input" placeholder="http://localhost:8081"></div>
        <div class="form-group"><label>Description</label><input id="rDesc" class="form-input" placeholder="optional"></div>
        <div class="form-group"><label>Version</label><input id="rVer" class="form-input" value="0.0.1"></div>
        <div class="form-group"><label>Type</label><select id="rType" class="form-input"><option value="MCP">MCP</option><option value="WEBAPP">WEBAPP</option></select></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" onclick="register()" style="width:100%">Register</button></div>
      </div>
      <div id="registerMsg" class="register-msg"></div>
    </div>
  </div>

  <!-- Server list -->
  <div class="grid-header">
    <div class="grid-title">Registered Servers</div>
    <button class="btn btn-ghost" onclick="load()" style="padding:7px 14px;font-size:12px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
  <div class="server-grid" id="serverGrid"></div>
</main>

<!-- Probe Modal -->
<div class="modal-overlay" id="probeModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="modal-title" id="modalTitle"></span>
        <span class="modal-meta" id="modalMeta"></span>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body"><pre id="modalBody" class="modal-loading">불러오는 중...</pre></div>
  </div>
</div>

<script>
let formOpen = false;

function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('registerPanel').classList.toggle('open', formOpen);
}

function toast(title, sub, type = 'ok', dur = 3000) {
  let stack = document.getElementById('toastStack');
  if (!stack) { stack = document.createElement('div'); stack.id = 'toastStack'; document.body.appendChild(stack); }
  const ic = { ok:'✓', err:'✕', info:'ℹ' }[type] || 'ℹ';
  const el = document.createElement('div');
  el.className = 't ' + type;
  el.style.setProperty('--tdur', dur + 'ms');
  el.innerHTML = `<div class="t-ic">${ic}</div><div class="t-body"><div class="t-title">${title}</div>${sub ? `<div class="t-sub">${sub}</div>` : ''}</div><div class="t-bar"></div>`;
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); }, dur);
}

function timeAgo(iso) {
  const d = Math.round((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return `${d}s ago`;
  if (d < 3600) return `${Math.floor(d/60)}m ago`;
  return `${Math.floor(d/3600)}h ago`;
}

async function load() {
  const res = await fetch('/api/mcp/servers');
  const { servers } = await res.json();
  const grid = document.getElementById('serverGrid');

  if (!servers.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⬡</div>
      <div class="empty-title">No servers registered</div>
      <div style="font-size:12px;margin-top:4px">Register your first MCP server above</div>
    </div>`;
    return;
  }

  grid.innerHTML = servers.map(s => {
    const st = s.status.toLowerCase();
    const tools = (s.tools||[]).map(t => `<span class="tool-badge">${t.name}</span>`).join('');
    return `
    <div class="server-card">
      <div class="card-top">
        <span class="card-name">${s.name}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="status-badge ${st}">${s.status}</span>
          <div class="status-dot ${st}"></div>
        </div>
      </div>
      <div class="card-url">${s.url}</div>
      <div class="card-tools">${tools || '<span style="font-size:11px;color:var(--muted)">no tools</span>'}</div>
      <div class="card-probe">
        <button class="btn-probe" onclick="probe('${s.id}','${s.name}','tools/list')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          tools/list
        </button>
        <button class="btn-probe" onclick="probe('${s.id}','${s.name}','resources/list')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          resources/list
        </button>
      </div>
      <div class="card-footer">
        <span class="card-time">${timeAgo(s.registeredAt)}</span>
        <button class="btn btn-danger" onclick="del('${s.id}','${s.name}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function register() {
  const body = { name: document.getElementById('rName').value, url: document.getElementById('rUrl').value, description: document.getElementById('rDesc').value, version: document.getElementById('rVer').value, type: document.getElementById('rType').value };
  const msg = document.getElementById('registerMsg');
  if (!body.name || !body.url) { msg.innerHTML = '<span class="msg-err">Name and URL are required.</span>'; return; }
  const res = await fetch('/api/mcp/servers/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  msg.innerHTML = `<span class="msg-ok">Registered — ${data.serverId}</span>`;
  toast('서버 등록 완료', body.name, 'ok');
  load();
}

async function probe(serverId, serverName, method) {
  const modal = document.getElementById('probeModal');
  const bodyEl = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = method;
  document.getElementById('modalMeta').textContent = serverName;
  bodyEl.className = 'modal-loading';
  bodyEl.textContent = '불러오는 중...';
  modal.classList.add('open');

  try {
    const res = await fetch(`/api/mcp/servers/${serverId}/probe?method=${encodeURIComponent(method)}`);
    const data = await res.json();
    bodyEl.className = '';
    bodyEl.textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    bodyEl.className = 'modal-err';
    bodyEl.textContent = '요청 실패: ' + e.message;
  }
}

function closeModal() {
  document.getElementById('probeModal').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function del(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  await fetch(`/api/mcp/servers/${id}`, { method: 'DELETE' });
  toast('서버 삭제됨', name, 'err'); load();
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
