spring:
  application:
    name: mcp-hub
  config:
    import: optional:file:.env[.properties],optional:file:.env.local[.properties]

  web:
    resources:
      add-mappings: true

  ai:
    mcp:
      server:
        enabled: false
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mcporchestrator}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: false

oss:
  api:
    cookie: ${OSS_API_COOKIE:}
  datasource:
    url: ${OSS_DB_URL:}
    username: ${OSS_DB_USERNAME:}
    password: ${OSS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

mcp:
  orchestrator:
    health-check:
      interval: 60000
  oauth:
    # 실제 OAuth 서버 연동 시 아래 주석 해제 후 URL 설정
    # access-token-url: http://oauth-server/api/token/exchange

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
  packages-to-scan: sevin.mcporchestrator

logging:
  level:
    sevin.mcporchestrator: INFO
