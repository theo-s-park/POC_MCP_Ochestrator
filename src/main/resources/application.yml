spring:
  application:
    name: mcp-hub
  config:
    import: optional:file:.env.local[.properties]

  web:
    resources:
      add-mappings: true

  ai:
    mcp:
      server:
        enabled: false
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

  datasource:
    url: jdbc:h2:file:./data/mcporchestrator
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

mcp:
  orchestrator:
    health-check:
      interval: 60000
  oauth:
    # 실제 OAuth 서버 연동 시 아래 주석 해제 후 URL 설정
    # access-token-url: http://oauth-server/api/token/exchange

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
  packages-to-scan: sevin.mcporchestrator

logging:
  level:
    sevin.mcporchestrator: INFO
